services:
  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    name: docmind-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

    envVars:
      # Database — use Render's managed PostgreSQL (add it in the dashboard
      # and link it here, or set DATABASE_URL manually below).
      - key: DATABASE_URL
        fromDatabase:
          name: docmind-db
          property: connectionString

      # Qdrant — the app falls back to embedded local storage (./qdrant_data)
      # automatically if no remote QDRANT_URL / QDRANT_API_KEY are set.
      # To use Qdrant Cloud, set both variables in the Render dashboard.
      - key: QDRANT_URL
        value: ""
      - key: QDRANT_API_KEY
        value: ""
      - key: QDRANT_COLLECTION
        value: docmind_chunks

      # Embedding — fastembed (BAAI/bge-small-en-v1.5) = 384-dim, fully local.
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_DIM
        value: "384"

      # LLM — set your Groq or Gemini key in the Render dashboard.
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false          # set in Render dashboard (secret)
      - key: GEMINI_API_KEY
        sync: false          # set in Render dashboard (secret, optional)
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004

      # Auth — generate a strong random secret and paste it in the dashboard.
      - key: JWT_SECRET
        sync: false          # set in Render dashboard (secret)
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"

      # CORS — add your Vercel frontend URL here.
      - key: CORS_ORIGINS
        value: https://documind-ai-six-nu.vercel.app

      # Uploads
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: UPLOAD_DIR
        value: ./uploads

  # ── Managed PostgreSQL ────────────────────────────────────────────────────
databases:
  - name: docmind-db
    plan: free
    region: oregon

