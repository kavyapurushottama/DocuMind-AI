services:
  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    name: documind-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

    envVars:
      - key: ENVIRONMENT
        value: production

      # Database — External Neon PostgreSQL connection string
      - key: DATABASE_URL
        sync: false          # Set your Neon connection string in the Render dashboard

      # Qdrant Cloud Configuration
      - key: QDRANT_URL
        sync: false          # e.g., https://xyz.eu-central.aws.cloud.qdrant.io:6333
      - key: QDRANT_API_KEY
        sync: false          # Qdrant Cloud API key
      - key: QDRANT_COLLECTION
        value: docmind_chunks

      # Embedding — standardized to fastembed (BAAI/bge-small-en-v1.5 = 384 dimensions)
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_DIM
        value: "384"

      # LLM Generation Providers
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false          # set in Render dashboard (secret)
      - key: GEMINI_API_KEY
        sync: false          # set in Render dashboard (secret, optional)
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

      # Authentication
      - key: JWT_SECRET
        sync: false          # set in Render dashboard (secret)
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"

      # CORS
      - key: CORS_ORIGINS
        value: https://documind-ai-six-nu.vercel.app

      # Storage & Upload limits
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: UPLOAD_DIR
        value: ./uploads
